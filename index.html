<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioShield AI - Dashboard</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>
<body>

    <div class="dashboard-container">
        
        <div class="form-section">
            <h1>CardioShield AI</h1>
            <p>Enter patient medical metrics to analyze cardiovascular health risk.</p>
            
            <form id="predictionForm">
                <div class="input-grid">
                    <div class="input-group">
                        <label for="age">Age (Years)</label>
                        <input type="number" id="age" placeholder="e.g. 45" required min="1" max="120">
                    </div>
                    <div class="input-group">
                        <label for="sex">Gender</label>
                        <select id="sex" required>
                            <option value="1">Male</option>
                            <option value="0">Female</option>
                        </select>
                    </div>

                    <div class="input-group full-width">
                        <label for="cp">Chest Pain Type</label>
                        <select id="cp" required>
                            <option value="0">Typical Angina</option>
                            <option value="1">Atypical Angina</option>
                            <option value="2">Non-anginal Pain</option>
                            <option value="3">Asymptomatic</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="trestbps">Resting BP (mm Hg)</label>
                        <input type="number" id="trestbps" placeholder="e.g. 120" required min="50" max="250">
                    </div>
                    <div class="input-group">
                        <label for="chol">Cholesterol (mg/dl)</label>
                        <input type="number" id="chol" placeholder="e.g. 200" required min="100" max="600">
                    </div>

                    <div class="input-group">
                        <label for="fbs">Fasting Blood Sugar > 120 mg/dl</label>
                        <select id="fbs" required>
                            <option value="0">False (Normal)</option>
                            <option value="1">True (High)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="restecg">Resting ECG Results</label>
                        <select id="restecg" required>
                            <option value="0">Normal</option>
                            <option value="1">ST-T Wave Abnormality</option>
                            <option value="2">Left Ventricular Hypertrophy</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="thalach">Max Heart Rate</label>
                        <input type="number" id="thalach" placeholder="e.g. 150" required min="60" max="220">
                    </div>
                    <div class="input-group">
                        <label for="exang">Exercise Induced Angina</label>
                        <select id="exang" required>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="oldpeak">Oldpeak (ST Depression)</label>
                        <input type="number" step="0.1" id="oldpeak" placeholder="e.g. 1.5" required min="0" max="10">
                    </div>
                    <div class="input-group">
                        <label for="slope">Slope of Peak Exercise ST</label>
                        <select id="slope" required>
                            <option value="0">Upsloping</option>
                            <option value="1">Flat</option>
                            <option value="2">Downsloping</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="ca">Vessels Colored (CA)</label>
                        <select id="ca" required>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="thal">Thalassemia (Thal)</label>
                        <select id="thal" required>
                            <option value="0">Normal</option>
                            <option value="1">Fixed Defect</option>
                            <option value="2">Reversible Defect</option>
                            <option value="3">Severe Defect</option>
                        </select>
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="submit" class="btn-predict">Predict Health Risk</button>
                    <button type="button" class="btn-clear" id="clearBtn">Clear All</button>
                </div>
            </form>
        </div>

        <div class="preview-section" id="resultContainer">
            <div class="result-image-wrapper">
                <img src="{{ url_for('static',filename='heart-dashboard.png') }}" alt="Heart Diagnostic View" class="result-status-img" id="resultImage">
            </div>
            <h3 id="resultTitle">Awaiting Analysis</h3>
            <p id="resultText">Fill out the patient metrics on the left and click predict to run the AI cardiac risk assessment model.</p>
            <div id="badgeOutput" class="risk-badge hidden"></div>
        </div>

    </div>

    <script src="{{ url_for ('static', filename='script.js') }}"></script>
</body>
</html>
